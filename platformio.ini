; Each environment builds exactly one independent firmware.
[platformio]
src_dir = labs
default_envs = external-interrupt-and-timer0

[env]
platform = atmelavr@5.1.0
board = megaatmega2560
board_build.f_cpu = 16000000L
monitor_speed = 9600
build_flags = -Wall -Wextra

[env:led-sequence]
build_src_filter = -<*> +<led-sequence/main.c>

[env:led-bounce]
build_src_filter = -<*> +<led-bounce/main.c>

[env:led-odd-even-sequence]
build_src_filter = -<*> +<led-odd-even-sequence/main.c>

[env:external-interrupt-counter]
build_src_filter = -<*> +<external-interrupt-counter/main.c>

[env:timer0-led-counter]
build_src_filter = -<*> +<timer0-led-counter/main.c>

[env:external-interrupt-and-timer0]
build_src_filter = -<*> +<external-interrupt-and-timer0/main.c>

[env:potentiometer-led-output]
build_src_filter = -<*> +<potentiometer-led-output/main.cpp>
framework = arduino

[env:servo-external-interrupt-counter]
build_src_filter = -<*> +<servo-external-interrupt-counter/main.cpp>
framework = arduino
lib_deps = arduino-libraries/Servo@1.2.2

[env:adc-threshold]
build_src_filter = -<*> +<adc-threshold/main.cpp>
framework = arduino

[env:adc-moving-average]
build_src_filter = -<*> +<adc-moving-average/main.cpp>
framework = arduino
build_flags = ${env.build_flags} -DADC_WINDOW_SIZE=10

